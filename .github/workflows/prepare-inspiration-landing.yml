name: Prepare inspiration landing page

on:
  push:
    branches: [inspiration-intelligence]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Build inspiration landing page') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: inspiration-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/prepare-inspiration-landing.py
      - name: Commit landing page
        run: |
          if git diff --quiet -- index.html; then
            echo "Landing page already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build inspiration landing page"
          git push origin HEAD:inspiration-intelligence
