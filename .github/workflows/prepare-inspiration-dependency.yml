name: Prepare inspiration dependency

on:
  push:
    branches: [inspiration-intelligence]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Build inspiration dependency') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: inspiration-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/prepare-inspiration-dependency.py
      - name: Commit registry
        run: |
          if git diff --quiet -- registry.json; then
            echo "Dependency already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "Build inspiration dependency"
          git push origin HEAD:inspiration-intelligence
