name: Finalize public README and branches

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/finalize-public-repo.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Make the README public-facing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "\n## Why the PowerShell install failed\n"
          end_marker = "\n### Windows PowerShell\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Expected personalized PowerShell section was not found.")

          replacement = (
              "\n## Developer installation — optional\n\n"
              "This route is for contributors and command-line users. Run it from a normal writable project directory rather than a protected operating-system folder.\n\n"
              "### Windows PowerShell\n"
          )
          path.write_text(text[:start] + replacement + text[end + len(end_marker):], encoding="utf-8")
          PY

      - name: Commit the README correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Make README public-facing"
          git push origin HEAD:master

      - name: Delete every non-default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].name' | while IFS= read -r branch; do
            if [ "$branch" = "master" ]; then
              continue
            fi
            encoded="${branch//\//%2F}"
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done
