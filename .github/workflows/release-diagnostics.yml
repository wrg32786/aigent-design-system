name: Rerun cancelled Desktop release

on:
  push:
    branches:
      - ops/release-diagnostics
    paths:
      - .github/workflows/release-diagnostics.yml

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Rerun the cancelled v1.2.0 packaging workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=31162200980
          gh run rerun "$RUN_ID"
          echo "Requested rerun for Desktop release workflow $RUN_ID"
      - name: Report release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow desktop-release.yml --limit 10 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.2.0" --jq '{tag_name, name, draft, prerelease, published_at, assets: [.assets[] | {name, size, state, browser_download_url}]}' || true
