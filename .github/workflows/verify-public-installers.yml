name: Verify public Desktop installers

on:
  pull_request:
    paths:
      - scripts/verify-desktop-release.mjs
      - .github/workflows/verify-public-installers.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify; leave blank to verify the latest release
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verify-public-installers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify installer assets and public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -n "$TAG" ]; then
            node scripts/verify-desktop-release.mjs --tag "$TAG" --download-check
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/verify-desktop-release.mjs --tag "v$(node -p 'require("./package.json").version')" --download-check
          else
            node scripts/verify-desktop-release.mjs --latest --download-check
          fi
