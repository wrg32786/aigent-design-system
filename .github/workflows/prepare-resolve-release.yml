name: Prepare design resolve release

on:
  push:
    branches: [agent/design-resolve-loop]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'Build AIgent Resolve release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/design-resolve-loop
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/prepare-resolve-release.py
      - name: Commit prepared release
        run: |
          if git diff --quiet; then
            echo "Resolve release already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md PRODUCT.md DESIGN.md registry.json scripts/check.mjs scripts/check-registry.mjs docs/roadmap.md docs/project-context.md skills/README.md vault/app.js .github/ISSUE_TEMPLATE/bug.yml .github/PULL_REQUEST_TEMPLATE.md
          git commit -m "Build AIgent Resolve release"
          git push origin HEAD:agent/design-resolve-loop
