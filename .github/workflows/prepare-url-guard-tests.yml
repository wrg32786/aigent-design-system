name: Prepare URL guard tests

on:
  push:
    branches: [inspiration-intelligence]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Build URL guard tests') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: inspiration-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/prepare-url-guard-tests.py
      - name: Commit tests
        run: |
          if git diff --quiet; then
            echo "URL guard tests already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspiration/lib/common.mjs inspiration/lib/url-forensics.mjs scripts/inspiration-smoke.mjs scripts/check-inspiration.mjs
          git commit -m "Build URL guard tests"
          git push origin HEAD:inspiration-intelligence
