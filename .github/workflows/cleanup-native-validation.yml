name: Clean completed native validation branch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup-native-validation.yml

permissions:
  contents: write

concurrency:
  group: cleanup-native-validation
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete merged validation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/${GITHUB_REPOSITORY}/git/refs/heads/fix/desktop-release-validation || true
      - name: Remove this one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cleanup-native-validation.yml
          git commit -m "Remove completed native validation cleanup"
          git push
