name: Fix Vision README
on:
  push:
    branches: [agent/vision-critique]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Vision README layout') && !contains(github.event.head_commit.message, 'Remove Vision README helper') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/vision-critique
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/fix-vision-readme.py
      - name: Commit README fix
        run: |
          if git diff --quiet; then
            echo "Vision README is already composed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Fix Vision README layout"
          git push origin HEAD:agent/vision-critique
