name: Add packaged desktop smoke proof

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/aigent-desktop
          fetch-depth: 0
      - id: state
        run: |
          if grep -q 'function runtimeRoot()' desktop/main.mjs; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Add packaged application boot proof
        if: steps.state.outputs.needed == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path('desktop/main.mjs')
          body = main.read_text()
          marker = '''function packagedFile(relativePath) {\n  const packed = path.join(app.getAppPath(), relativePath);\n  const marker = `${path.sep}app.asar${path.sep}`;\n  const unpacked = packed.includes(marker) ? packed.replace(marker, `${path.sep}app.asar.unpacked${path.sep}`) : packed;\n  return fs.existsSync(unpacked) ? unpacked : packed;\n}\n'''
          replacement = marker + '''function runtimeRoot() {\n  return app.isPackaged ? path.dirname(packagedFile("package.json")) : root;\n}\n'''
          if marker not in body:
              raise SystemExit('Packaged file helper changed')
          body = body.replace(marker, replacement, 1)
          body = body.replace('    cwd: root,\n    encoding: "utf8",\n    env,', '    cwd: runtimeRoot(),\n    encoding: "utf8",\n    env,', 1)
          old = '''  if (isSmokeTest) {\n    await loadSetup("smoke");\n    const state = windowPayload();\n    if (!state.environment.runtime.available || !state.config.workspace) throw new Error("Desktop smoke check failed.");\n    setTimeout(() => app.quit(), 400);\n    return;\n  }'''
          new = '''  if (isSmokeTest) {\n    await loadSetup("smoke");\n    const state = windowPayload();\n    if (!state.environment.runtime.available || !state.config.workspace) throw new Error("Desktop smoke check failed.");\n    await new Promise((resolve) => setTimeout(resolve, 500));\n    const capture = await mainWindow.webContents.capturePage();\n    const proof = app.isPackaged\n      ? path.join(app.getPath("temp"), "aigent-desktop-setup.png")\n      : path.join(root, "artifacts", "desktop", "desktop-setup.png");\n    fs.mkdirSync(path.dirname(proof), { recursive: true });\n    fs.writeFileSync(proof, capture.toPNG());\n    const doctor = internalNodeRun([packagedFile(path.join("scripts", "cli.mjs")), "doctor"], { timeout: 180000 });\n    if (doctor.status !== 0) throw new Error((doctor.stderr || doctor.stdout || "Packaged doctor failed").trim());\n    const url = await startStudio();\n    const response = await fetch(url);\n    if (!response.ok) throw new Error(`Packaged Studio returned ${response.status}.`);\n    await stopStudio();\n    log("Desktop smoke proof passed", { proof, url });\n    setTimeout(() => app.quit(), 150);\n    return;\n  }'''
          if old not in body:
              raise SystemExit('Desktop smoke branch changed')
          main.write_text(body.replace(old, new, 1))

          package = Path('package.json')
          value = json.loads(package.read_text())
          value['scripts']['desktop:smoke:packaged'] = 'node scripts/smoke-packaged-desktop.mjs'
          package.write_text(json.dumps(value, indent=2) + '\n')

          check = Path('scripts/check-desktop.mjs')
          text = check.read_text()
          text = text.replace('  "scripts/prepare-desktop-build.mjs",\n', '  "scripts/prepare-desktop-build.mjs",\n  "scripts/smoke-packaged-desktop.mjs",\n')
          text = text.replace('for (const script of ["desktop:assets", "desktop:prepare", "desktop:start", "desktop:check", "desktop:smoke",', 'for (const script of ["desktop:assets", "desktop:prepare", "desktop:start", "desktop:check", "desktop:smoke", "desktop:smoke:packaged",')
          text = text.replace('"scripts/generate-desktop-assets.mjs", "scripts/prepare-desktop-build.mjs"]', '"scripts/generate-desktop-assets.mjs", "scripts/prepare-desktop-build.mjs", "scripts/smoke-packaged-desktop.mjs"]')
          text = text.replace('"latest-arm64", "latest-x64", "createStudioServer"', '"latest-arm64", "latest-x64", "capturePage", "runtimeRoot", "createStudioServer"')
          check.write_text(text)

          readme = Path('desktop/README.md')
          text = readme.read_text()
          marker = '''npm run desktop:check\nnpm run desktop:smoke\n'''
          replacement = '''npm run desktop:check\nnpm run desktop:smoke\nnpm run desktop:smoke:packaged  # after a native package build\n'''
          if marker not in text:
              raise SystemExit('Desktop smoke documentation changed')
          readme.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Refresh lockfile and validate
        if: steps.state.outputs.needed == 'true'
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run desktop:check
          xvfb-run -a npm run desktop:smoke
      - name: Commit packaged smoke proof
        if: steps.state.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/main.mjs desktop/README.md package.json package-lock.json scripts/check-desktop.mjs
          git commit -m "Verify packaged AIgent Desktop boot"
          git push origin HEAD:feature/aigent-desktop
