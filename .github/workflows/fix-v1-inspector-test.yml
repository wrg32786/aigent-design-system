name: Fix AIgent Studio 1.0 inspector proof

on:
  push:
    branches:
      - feature/aigent-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Harden v1 inspector browser proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/aigent-v1
      - name: Test inspector state and save proof captures
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-studio.mjs')
          text = path.read_text()
          old = '        assert.ok(await page.locator("#inspector-fields").isVisible());\n        assert.ok((await page.locator("#layers-tree .layer-row").count()) >= 3);'
          new = '''        assert.equal(await page.locator("#inspector-fields").getAttribute("hidden"), null);\n        assert.ok((await page.locator("#layers-tree .layer-row").count()) >= 3);'''
          if old not in text:
              raise SystemExit('Expected inspector assertion was not found')
          text = text.replace(old, new)
          old2 = '        assert.equal(overflow, false);\n        assert.deepEqual(errors, []);'
          new2 = '''        assert.equal(overflow, false);\n        const proofDirectory = path.resolve("artifacts", "studio");\n        fs.mkdirSync(proofDirectory, { recursive: true });\n        await page.screenshot({ path: path.join(proofDirectory, viewport.width > 760 ? "studio-v1-desktop.png" : "studio-v1-mobile.png"), fullPage: true });\n        assert.deepEqual(errors, []);'''
          if old2 not in text:
              raise SystemExit('Expected screenshot insertion point was not found')
          path.write_text(text.replace(old2, new2))
          PY
      - name: Commit proof update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-studio.mjs
          git commit -m "Harden v1 inspector browser proof"
          git push origin HEAD:feature/aigent-v1
