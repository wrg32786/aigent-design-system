name: Apply connected first-run fix

on:
  push:
    branches:
      - product/connected-first-run
    paths:
      - scripts/fix-connected-first-run.mjs
      - .github/workflows/apply-connected-first-run-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product/connected-first-run
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/fix-connected-first-run.mjs
      - run: |
          node --check desktop/main.mjs
          node --check desktop/renderer/app.js
          node --check scripts/check-desktop.mjs
      - name: Commit the final source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete cross-platform connected onboarding"
          git push origin HEAD:product/connected-first-run
