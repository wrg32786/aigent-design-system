name: Prepare copy fingerprints

on:
  push:
    branches: [inspiration-intelligence]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Build private copy fingerprints') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: inspiration-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/prepare-copy-fingerprints.py
      - name: Commit fingerprints
        run: |
          if git diff --quiet; then
            echo "Fingerprints already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspiration/lib/design-dna.mjs inspiration/lib/originality.mjs inspiration/schemas/design-dna.schema.json scripts/inspiration-smoke.mjs SECURITY.md
          git commit -m "Build private copy fingerprints"
          git push origin HEAD:inspiration-intelligence
