name: Remove temporary product branches

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup-temporary-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Delete temporary branches
        run: |
          for branch in \
            ops/release-diagnostics \
            product/connected-first-run \
            product/agent-visual-context \
            product/simplify-onboarding
          do
            git push origin --delete "$branch" 2>/dev/null || true
          done
      - name: Remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-temporary-branches.yml
          git commit -m "Remove completed branch cleanup"
          git push origin HEAD:master
