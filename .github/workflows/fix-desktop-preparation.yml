name: Fix desktop preparation smoke test

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/aigent-desktop
          fetch-depth: 0
      - name: Allow Chromium smoke test in CI
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/prepare-desktop-release.yml')
          body = workflow.read_text()
          old = '"desktop:smoke": "electron . --smoke-test",'
          new = '"desktop:smoke": "electron . --smoke-test --no-sandbox",'
          if old not in body:
              raise SystemExit('Desktop smoke command not found')
          workflow.write_text(body.replace(old, new, 1))
          PY
          rm .github/workflows/fix-desktop-preparation.yml
      - name: Commit preparation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix desktop smoke preparation"
          git push origin HEAD:feature/aigent-desktop
