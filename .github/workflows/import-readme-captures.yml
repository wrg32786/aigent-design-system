name: Import README captures

on:
  push:
    branches:
      - docs/readme-real-proof

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message != 'Add real README screenshots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-real-proof
          fetch-depth: 0

      - name: Download validated visual proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8935438453/zip" \
            --output /tmp/visual-proof.zip
          mkdir -p /tmp/visual-proof
          unzip -q /tmp/visual-proof.zip -d /tmp/visual-proof

      - name: Prepare real browser captures
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('/tmp/visual-proof/visual')
          output = Path('docs/assets/readme/captures')
          output.mkdir(parents=True, exist_ok=True)

          captures = {
              'cinematic-page-desktop.png': 'cinematic-page.webp',
              'immersive-sales-deck-desktop.png': 'immersive-sales-deck.webp',
              'command-center-interface-desktop.png': 'command-center-interface.webp',
              'threejs-product-stage-desktop.png': 'threejs-product-stage.webp',
          }

          for source_name, output_name in captures.items():
              image = Image.open(source / source_name).convert('RGB')
              image = image.crop((0, 0, image.width, min(900, image.height)))
              height = round(image.height * 1200 / image.width)
              image = image.resize((1200, height), Image.Resampling.LANCZOS)
              image.save(output / output_name, 'WEBP', quality=78, method=6)
          PY

      - name: Remove superseded README artwork
        run: |
          rm -f docs/assets/readme/.keep
          rm -f docs/assets/readme/capability-strip.svg
          rm -f docs/assets/readme/system-map.svg
          rm -f docs/assets/readme/showcase-grid.svg
          rm -f docs/assets/readme/vision-proof.svg
          rm -f .github/workflows/import-readme-captures.yml

      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add real README screenshots"
          git push origin HEAD:docs/readme-real-proof
