name: Prepare HyperFrames registry

on:
  push:
    branches: [docs/readme-demo-hyperframes]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message != 'Include HyperFrames in creative production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/readme-demo-hyperframes
          fetch-depth: 0
      - name: Add HyperFrames files to creative-production install
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'registry.json';
          const registry = JSON.parse(fs.readFileSync(file, 'utf8'));
          const item = registry.items.find((entry) => entry.name === 'creative-production');
          if (!item) throw new Error('creative-production registry item is missing');
          const additions = [
            { path: 'integrations/hyperframes/README.md', type: 'registry:file', target: '~/integrations/hyperframes/README.md' },
            { path: 'creative-production/pipelines/hyperframes.md', type: 'registry:file', target: '~/creative-production/pipelines/hyperframes.md' },
            { path: 'skills/hyperframes-video/SKILL.md', type: 'registry:file', target: '~/.claude/skills/hyperframes-video/SKILL.md' },
          ];
          item.files ||= [];
          for (const addition of additions) {
            const current = item.files.find((entry) => entry.path === addition.path);
            if (current) Object.assign(current, addition);
            else item.files.push(addition);
          }
          fs.writeFileSync(file, `${JSON.stringify(registry, null, 2)}\n`);
          NODE
      - name: Validate and commit
        run: |
          npm ci
          npm run registry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "Include HyperFrames in creative production"
          git push origin HEAD:docs/readme-demo-hyperframes
