name: Validate AIgent Ship

on:
  pull_request:
    paths:
      - publish/**
      - skills/publish-site/**
      - skills/aigent-design/**
      - scripts/publish-site.mjs
      - scripts/studio-publish.mjs
      - scripts/check-publish.mjs
      - scripts/apply-publish-routing.mjs
      - scripts/apply-publish-ux.mjs
      - studio/**
      - registry.json
      - package.json
      - package-lock.json
      - .github/workflows/publish-check.yml
  push:
    branches: [master]
    paths:
      - publish/**
      - skills/publish-site/**
      - skills/aigent-design/**
      - scripts/publish-site.mjs
      - scripts/studio-publish.mjs
      - scripts/check-publish.mjs
      - studio/**
      - registry.json
      - package.json
      - package-lock.json
      - .github/workflows/publish-check.yml

permissions:
  contents: write

concurrency:
  group: ship-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply final integration once
        run: |
          changed=0
          for script in scripts/apply-publish-routing.mjs scripts/apply-publish-ux.mjs; do
            if [ -f "$script" ]; then
              node --check "$script"
              node "$script"
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Complete publish routing and Studio UX"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - run: npm ci
      - run: npm run publish:check
      - run: npm run studio:check
      - name: Exercise local export through the CLI
        run: |
          rm -rf "$RUNNER_TEMP/aigent-publish-project"
          node scripts/cli.mjs add cinematic-page --target "$RUNNER_TEMP/aigent-publish-project"
          node scripts/publish-site.mjs export \
            --project-dir "$RUNNER_TEMP/aigent-publish-project" \
            --entry /templates/modular-scroll-starter/
          test -s "$RUNNER_TEMP/aigent-publish-project/.aigent/publish/export-manifest.json"
          find "$RUNNER_TEMP/aigent-publish-project/.aigent/publish/exports" -name index.html -type f -print -quit | grep .
