name: Validate AIgent Ship

on:
  pull_request:
    paths:
      - publish/**
      - skills/publish-site/**
      - scripts/publish-site.mjs
      - scripts/studio-publish.mjs
      - scripts/check-publish.mjs
      - scripts/apply-ship-followups.mjs
      - studio/**
      - registry.json
      - package.json
      - package-lock.json
      - .github/workflows/publish-check.yml
  push:
    branches: [master]
    paths:
      - publish/**
      - skills/publish-site/**
      - scripts/publish-site.mjs
      - scripts/studio-publish.mjs
      - scripts/check-publish.mjs
      - studio/**
      - registry.json
      - package.json
      - package-lock.json
      - .github/workflows/publish-check.yml

permissions:
  contents: write

concurrency:
  group: ship-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply follow-up fixes once
        if: ${{ hashFiles('scripts/apply-ship-followups.mjs') != '' }}
        run: |
          node --check scripts/apply-ship-followups.mjs
          node scripts/apply-ship-followups.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden publish provider and export behavior"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - run: npm ci
      - run: npm run publish:check
      - run: npm run studio:check
      - name: Exercise local export through the CLI
        run: |
          rm -rf /tmp/aigent-publish-project
          node scripts/cli.mjs add cinematic-page --target /tmp/aigent-publish-project
          node scripts/publish-site.mjs export \
            --project-dir /tmp/aigent-publish-project \
            --entry /templates/modular-scroll-starter/
          test -s /tmp/aigent-publish-project/.aigent/publish/export-manifest.json
          find /tmp/aigent-publish-project/.aigent/publish/exports -name index.html -type f -print -quit | grep .
