name: Cleanup merged branches

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'cleanup/merged-branches'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged work branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in ci/fix-release-identity cleanup/merged-branches; do
            encoded="${branch//\//%2F}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" || true
          done
