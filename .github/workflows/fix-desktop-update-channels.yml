name: Fix architecture-specific desktop updates

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/aigent-desktop
          fetch-depth: 0
      - id: state
        run: |
          if grep -q 'latest-arm64' desktop/main.mjs; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Use architecture-specific macOS update channels
        if: steps.state.outputs.needed == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('desktop/main.mjs')
          body = main.read_text()
          old = '''  autoUpdater.autoDownload = true;\n  autoUpdater.autoInstallOnAppQuit = true;'''
          new = '''  autoUpdater.autoDownload = true;\n  autoUpdater.autoInstallOnAppQuit = true;\n  if (process.platform === "darwin") {\n    autoUpdater.channel = process.arch === "arm64" ? "latest-arm64" : "latest-x64";\n    autoUpdater.allowDowngrade = false;\n  }'''
          if old not in body:
              raise SystemExit('Updater setup contract changed')
          main.write_text(body.replace(old, new, 1))

          readme = Path('desktop/README.md')
          text = readme.read_text()
          marker = 'Operating-system trust requires the signing credentials documented below. Project workspaces live outside the application bundle and are not removed by updates.'
          replacement = 'Operating-system trust requires the signing credentials documented below. Apple Silicon and Intel builds use separate update channels so each Mac receives the matching architecture. Project workspaces live outside the application bundle and are not removed by updates.'
          if marker not in text:
              raise SystemExit('Desktop update documentation contract changed')
          readme.write_text(text.replace(marker, replacement, 1))

          check = Path('scripts/check-desktop.mjs')
          text = check.read_text()
          old = 'for (const contract of ["contextIsolation: true", "sandbox: true", "nodeIntegration: false", "setPermissionRequestHandler", "requestSingleInstanceLock", "autoUpdater", "createStudioServer"])'
          new = 'for (const contract of ["contextIsolation: true", "sandbox: true", "nodeIntegration: false", "setPermissionRequestHandler", "requestSingleInstanceLock", "autoUpdater", "latest-arm64", "latest-x64", "createStudioServer"])'
          if old not in text:
              raise SystemExit('Desktop main validation contract changed')
          check.write_text(text.replace(old, new, 1))
          PY
      - name: Commit updater fix
        if: steps.state.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/main.mjs desktop/README.md scripts/check-desktop.mjs
          git commit -m "Use architecture-specific macOS updates"
          git push origin HEAD:feature/aigent-desktop
