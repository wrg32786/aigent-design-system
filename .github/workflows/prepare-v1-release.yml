name: Prepare AIgent Studio 1.0

on:
  push:
    branches:
      - feature/aigent-v1

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message != 'Integrate AIgent Studio 1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/aigent-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate AIgent Studio 1.0
        run: node scripts/prepare-v1-release.mjs
      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate AIgent Studio 1.0"
          git push origin HEAD:feature/aigent-v1
