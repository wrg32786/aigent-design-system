name: Fix mobile theme picker

on:
  push:
    branches: [agent/design-resolve-loop]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix mobile theme picker zoom') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/design-resolve-loop
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/fix-mobile-theme-picker.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Theme picker already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/modular-scroll-starter/index.html
          git commit -m "Fix mobile theme picker zoom"
          git push origin HEAD:agent/design-resolve-loop
