name: Finalize AIgent Desktop runtime

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/aigent-desktop
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Finalize bundled browser and desktop contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              body = file.read_text()
              if old not in body:
                  raise SystemExit(f"Missing expected text in {path}: {old[:100]!r}")
              file.write_text(body.replace(old, new))

          gitignore = Path('.gitignore')
          body = gitignore.read_text()
          if 'desktop/resources/playwright/' not in body.splitlines():
              body += ('' if body.endswith('\n') else '\n') + 'desktop/resources/playwright/\n'
          gitignore.write_text(body)

          replace('README.md', 'universal **macOS** disk image (`.dmg`)', '**macOS Apple Silicon or Intel** disk image (`.dmg`)')
          replace('README.md', 'configures startup and signed updates', 'configures startup and published updates')
          replace('CHANGELOG.md', 'universal macOS DMG and ZIP packaging with custom artwork', 'architecture-matched macOS Apple Silicon and Intel DMG/ZIP packaging with custom artwork')
          replace('desktop/README.md', '- macOS universal disk image (`.dmg`)\n- macOS universal update archive (`.zip`)', '- macOS Apple Silicon and Intel disk images (`.dmg`)\n- macOS Apple Silicon and Intel update archives (`.zip`)')
          replace('desktop/README.md', 'Packaged Windows NSIS and macOS builds use `electron-updater` against this repository\'s GitHub Releases. AIgent Desktop checks after startup when automatic updates are enabled, downloads a newer signed build, and asks the operator before restarting to install it.', 'Packaged Windows NSIS and macOS builds use `electron-updater` against this repository\'s GitHub Releases. AIgent Desktop checks after startup when automatic updates are enabled, downloads the newer published build, and asks the operator before restarting to install it. Operating-system trust requires the signing credentials documented below.')
          replace('desktop/README.md', 'npm run desktop:assets\nnpm run desktop:pack', 'npm run desktop:prepare\nnpm run desktop:pack')
          replace('desktop/renderer/index.html', '<strong>Automatically download signed updates</strong><small>Uses GitHub release metadata generated by the desktop build.</small>', '<strong>Automatically download published updates</strong><small>Signed public releases use the configured Windows or Apple credentials.</small>')

          main = Path('desktop/main.mjs')
          body = main.read_text()
          old = '''      await stopStudio();\n      const workspace = config.workspace;\n      fs.rmSync(app.getPath("userData"), { recursive: true, force: true });\n      config = normalizeConfig({ ...defaultConfig({ documents: documentsPath() }), workspace }, { documents: documentsPath() });\n      writeConfig(configFile(), config, { documents: documentsPath() });\n      return true;'''
          new = '''      await stopStudio();\n      const workspace = config.workspace;\n      fs.rmSync(configFile(), { force: true });\n      fs.rmSync(runtimeDirectory(), { recursive: true, force: true });\n      fs.rmSync(logFile(), { force: true });\n      config = normalizeConfig({ ...defaultConfig({ documents: documentsPath() }), workspace }, { documents: documentsPath() });\n      writeConfig(configFile(), config, { documents: documentsPath() });\n      environment = refreshEnvironment();\n      return true;'''
          if old not in body:
              raise SystemExit('Desktop app-data reset contract changed')
          main.write_text(body.replace(old, new, 1))

          check = Path('scripts/check-desktop.mjs')
          body = check.read_text()
          body = body.replace('  installCommand,\n', '  authCommand,\n  installCommand,\n')
          body = body.replace('  "scripts/generate-desktop-assets.mjs",\n', '  "scripts/generate-desktop-assets.mjs",\n  "scripts/prepare-desktop-build.mjs",\n')
          body = body.replace('for (const script of ["desktop:assets", "desktop:start",', 'for (const script of ["desktop:assets", "desktop:prepare", "desktop:start",')
          body = body.replace('for (const name of ["electron-updater"])', 'for (const name of ["electron-updater", "playwright"])')
          body = body.replace('for (const name of ["electron", "electron-builder", "playwright"])', 'for (const name of ["electron", "electron-builder"])') if 'for (const name of ["electron", "electron-builder", "playwright"])' in body else body
          body = body.replace('for (const name of ["electron", "electron-builder"]) assert.equal', 'for (const name of ["electron", "electron-builder"]) assert.equal')
          body = body.replace('"asarUnpack:",', '"asarUnpack:", "extraResources:", "to: playwright",')
          body = body.replace('"scripts/generate-desktop-assets.mjs"]', '"scripts/generate-desktop-assets.mjs", "scripts/prepare-desktop-build.mjs"]')
          marker = '  assert.equal(installCommand("manual", environment), null);\n'
          body = body.replace(marker, marker + '  assert.deepEqual(authCommand("codex", { codex: { available: true, command: "codex" } }).args, ["login"]);\n')
          check.write_text(body)

          check_system = Path('scripts/check.mjs')
          body = check_system.read_text()
          body = body.replace('"desktop/README.md", "electron-builder.yml",', '"desktop/README.md", "electron-builder.yml", "scripts/prepare-desktop-build.mjs",')
          check_system.write_text(body)
          PY
      - name: Refresh lockfile and validate
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run desktop:check
          npm run check
          xvfb-run -a npm run desktop:smoke
      - name: Remove finalization workflow
        run: rm .github/workflows/finalize-desktop-runtime.yml
      - name: Commit finalized desktop runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize AIgent Desktop runtime"
          git push origin HEAD:feature/aigent-desktop
