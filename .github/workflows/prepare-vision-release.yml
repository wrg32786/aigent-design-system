name: Prepare Vision release
on:
  push:
    branches: [agent/vision-critique]
permissions:
  contents: write
jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate AIgent Vision') && !contains(github.event.head_commit.message, 'Remove Vision preparation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/vision-critique
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/prepare-vision-release.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "Vision release is already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json README.md PRODUCT.md DESIGN.md CHANGELOG.md resolve/README.md skills vault/app.js
          git commit -m "Integrate AIgent Vision"
          git push origin HEAD:agent/vision-critique
