name: Apply connected first-run onboarding

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-connected-first-run
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'product/connected-first-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product/connected-first-run
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/apply-connected-product.mjs
      - name: Commit the focused onboarding update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete connected first-run onboarding"
          git push origin HEAD:product/connected-first-run
