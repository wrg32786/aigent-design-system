name: Validate Aigent

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run install:check
      - run: npm run taste:check
      - run: npm run registry
      - run: npm run intelligence
      - run: npm run inspiration
      - run: npm run resolve:check
      - run: npm run vision:check
      - run: npm run publish:check
      - run: npm run eval
      - name: Exercise package-backed project setup
        run: |
          rm -rf /tmp/aigent-design-install /tmp/aigent-design-plan.json /tmp/aigent-inspiration /tmp/aigent-inspiration-plan.json
          mkdir -p /tmp/aigent-design-install
          printf '# Customer Product\n' > /tmp/aigent-design-install/PRODUCT.md
          printf '# Customer Design\n' > /tmp/aigent-design-install/DESIGN.md
          node scripts/cli.mjs install --target /tmp/aigent-design-install
          node scripts/cli.mjs init --target /tmp/aigent-design-install
          node scripts/cli.mjs install --target /tmp/aigent-design-install
          grep -q 'Customer Product' /tmp/aigent-design-install/PRODUCT.md
          grep -q 'Customer Design' /tmp/aigent-design-install/DESIGN.md
          test -f /tmp/aigent-design-install/.aigent/install.json
          test -f /tmp/aigent-design-install/.aigent/project-context.md
          test -f /tmp/aigent-design-install/.claude/skills/aigent-design/SKILL.md
          test -f /tmp/aigent-design-install/.claude/skills/aigent-design/reference/publish.md
          test -f /tmp/aigent-design-install/.claude/skills/aigent-design/visual-exemplars/index.json
          test ! -f /tmp/aigent-design-install/scripts/inspire.mjs
          test ! -f /tmp/aigent-design-install/tokens/system.css
          node scripts/cli.mjs plan design-intelligence/example-brief.json --out /tmp/aigent-design-plan.json
          node scripts/cli.mjs inspire add inspiration/examples/editorial-reference.json --root /tmp/aigent-inspiration --id editorial --kind structured-reference --analysis inspiration/examples/editorial-reference.json
          node scripts/cli.mjs inspire add inspiration/examples/immersive-reference.json --root /tmp/aigent-inspiration --id immersive --kind structured-reference --analysis inspiration/examples/immersive-reference.json
          node scripts/cli.mjs inspire add inspiration/examples/interface-reference.json --root /tmp/aigent-inspiration --id interface --kind structured-reference --analysis inspiration/examples/interface-reference.json
          node scripts/cli.mjs inspire compose --root /tmp/aigent-inspiration --brief inspiration/evals/briefs/immersive-product-launch.json --refs editorial,immersive,interface --out /tmp/aigent-inspiration-plan.json
          test -s /tmp/aigent-design-plan.json
          test -s /tmp/aigent-inspiration-plan.json
      - name: Validate the GitHub registry with shadcn
        run: |
          REF="${GITHUB_HEAD_REF:-$GITHUB_SHA}"
          npx --yes shadcn@latest registry validate "${GITHUB_REPOSITORY}#${REF}"

  consumer-install:
    name: public install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Use current npm
        run: npm install --global npm@12
      - name: Exercise the exact public npx path
        shell: bash
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          TARGET="${RUNNER_TEMP}/aigent-public-install"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          printf '# Customer Product\n' > "$TARGET/PRODUCT.md"
          printf '# Customer Design\n' > "$TARGET/DESIGN.md"
          npx --yes "github:${GITHUB_REPOSITORY}#${REF}" install --target "$TARGET"
          npx --yes "github:${GITHUB_REPOSITORY}#${REF}" init --target "$TARGET"
          test -f "$TARGET/.claude/skills/aigent-design/SKILL.md"
          test -f "$TARGET/.claude/skills/aigent-design/reference/publish.md"
          test -f "$TARGET/.aigent/install.json"
          test -f "$TARGET/.aigent/project-context.md"
          grep -q 'Customer Product' "$TARGET/PRODUCT.md"
          grep -q 'Customer Design' "$TARGET/DESIGN.md"
          test ! -f "$TARGET/scripts/inspire.mjs"
          test ! -f "$TARGET/tokens/system.css"

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Start preview server
        run: |
          npm run serve > /tmp/aigent-design-system-server.log 2>&1 &
          echo $! > /tmp/aigent-design-system-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4177/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aigent-design-system-server.log
          exit 1
      - run: npm run smoke
      - run: npm run inspiration:smoke
      - name: Exercise Resolve and prepare visual review
        run: |
          rm -rf artifacts/resolve
          node scripts/cli.mjs resolve \
            --target templates/modular-scroll-starter \
            --url http://127.0.0.1:4177/templates/modular-scroll-starter/ \
            --out artifacts/resolve \
            --no-fail
          test -s artifacts/resolve/latest.json
          node -e 'const r=require("./artifacts/resolve/latest.json"); if(!r.gate.pass||r.browserEvidence.length!==3||r.captures.length!==4)process.exit(1)'
          node scripts/cli.mjs vision prepare \
            --target templates/modular-scroll-starter \
            --url http://127.0.0.1:4177/templates/modular-scroll-starter/ \
            --out artifacts/resolve
          test -s artifacts/resolve/latest.visual-review-task.json
          test -s artifacts/resolve/latest.visual-review.template.json
          test -s artifacts/resolve/latest.visual-review.prompt.md
      - run: npm run capture
      - uses: actions/upload-artifact@v4
        with:
          name: visual-proof
          path: |
            artifacts/visual
            artifacts/resolve
          if-no-files-found: error
          retention-days: 14
      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/aigent-design-system-server.pid)" 2>/dev/null || true
