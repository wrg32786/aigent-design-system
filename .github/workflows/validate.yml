name: Validate design system

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run registry
      - run: npm run intelligence
      - run: npm run eval

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run serve > /tmp/aigent-design-system-server.log 2>&1 &
          echo $! > /tmp/aigent-design-system-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4177/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aigent-design-system-server.log
          exit 1
      - run: npm run smoke
      - run: npm run capture
      - uses: actions/upload-artifact@v4
        with:
          name: visual-proof
          path: artifacts/visual
          if-no-files-found: error
          retention-days: 14
      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/aigent-design-system-server.pid)" 2>/dev/null || true
