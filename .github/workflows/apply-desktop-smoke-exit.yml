name: Apply deterministic Desktop smoke exit

on:
  push:
    branches:
      - product/beginner-first-studio
    paths:
      - scripts/apply-desktop-smoke-exit.mjs
      - .github/workflows/apply-desktop-smoke-exit.yml

permissions:
  contents: write

concurrency:
  group: apply-desktop-smoke-exit
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product/beginner-first-studio
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/apply-desktop-smoke-exit.mjs
      - name: Commit the focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Desktop smoke test exit deterministically [skip ci]"
          git push origin HEAD:product/beginner-first-studio
