name: Prepare private network guard

on:
  push:
    branches: [inspiration-intelligence]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Build private network guard') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: inspiration-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/prepare-private-network-guard.py
      - name: Commit guard
        run: |
          if git diff --quiet; then
            echo "Network guard already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspiration/lib/url-forensics.mjs scripts/inspire.mjs scripts/inspiration-smoke.mjs README.md inspiration/README.md SECURITY.md
          git commit -m "Build private network guard"
          git push origin HEAD:inspiration-intelligence
