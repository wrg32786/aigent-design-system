name: Fix AIgent Studio 1.0 browser check

on:
  push:
    branches:
      - feature/aigent-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix v1 Studio browser startup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/aigent-v1
      - name: Repair startup and add syntax checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          app = Path('studio/app.js')
          text = app.read_text()
          bad = 't(error.messdiff").addEventListener("click", () => refreshDiff().catch((error) => toast(error.message)));'
          good = '$("#refresh-diff").addEventListener("click", () => refreshDiff().catch((error) => toast(error.message)));'
          if bad not in text:
              raise SystemExit('Expected corrupted refresh-diff handler was not found')
          app.write_text(text.replace(bad, good))

          package = Path('package.json')
          data = json.loads(package.read_text())
          data['scripts']['studio:check'] = 'node --check studio/app.js && node --check studio/bridge.js && node scripts/check-studio.mjs'
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/app.js package.json
          git commit -m "Fix v1 Studio browser startup"
          git push origin HEAD:feature/aigent-v1
