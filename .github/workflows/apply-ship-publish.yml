name: Apply Ship and Publish integration

on:
  push:
    branches: [feature/ship-publish]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('scripts/apply-ship-publish-patch.mjs') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ship-publish
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply integration patch
        run: node scripts/apply-ship-publish-patch.mjs
      - name: Validate focused contracts
        run: |
          npm ci
          npm run publish:check
          npm run check
          npm run studio:check
          npm run registry
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add one-click site publishing"
          git push origin HEAD:feature/ship-publish
