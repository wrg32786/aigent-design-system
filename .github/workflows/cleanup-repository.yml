name: Final repository cleanup

on:
  workflow_dispatch:
  issues:
    types: [closed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: final-repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'wrg32786/aigent-design-system'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Delete every branch except master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" = "master" ] && continue
            encoded="${branch//\//%2F}"
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done

      - name: Remove one-time maintenance workflows
        run: |
          rm -f \
            .github/workflows/cleanup-repository.yml \
            .github/workflows/finalize-public-repo.yml \
            .github/workflows/finalize-v1.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No maintenance files remain."
          else
            git commit -m "Remove one-time repository maintenance"
            git push origin HEAD:master
          fi
