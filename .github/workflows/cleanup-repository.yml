name: Final repository cleanup

on:
  workflow_dispatch:
  issues:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: final-repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Run repository branch cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Delete every branch except master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" = "master" ] && continue
            encoded="${branch//\//%2F}"
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done

      - name: Remove this one-time workflow
        run: |
          rm -f .github/workflows/cleanup-repository.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove completed repository cleanup"
          git push origin HEAD:master
