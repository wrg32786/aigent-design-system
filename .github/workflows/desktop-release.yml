name: Build AIgent Desktop installers

on:
  workflow_run:
    workflows: ["Validate design system"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            command: npm run desktop:dist -- --win nsis --x64 --publish never
          - os: macos-14
            name: macos-universal
            command: npm run desktop:dist -- --mac dmg zip --universal --publish never
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:check
      - name: Prepare Apple API key
        if: matrix.os == 'macos-14' && secrets.APPLE_API_KEY != ''
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build native installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ${{ matrix.command }}
      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          find desktop-dist -maxdepth 1 -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o \
            -name '*.blockmap' -o -name 'latest*.yml' -o -name 'latest*.yaml' \
          \) -exec cp {} release-files/ \;
          test -n "$(find release-files -maxdepth 1 -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: aigent-desktop-${{ matrix.name }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: aigent-desktop-*
          path: release-files
          merge-multiple: true
      - name: Attach installers to validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v${VERSION}"
          for attempt in {1..18}; do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v version="$VERSION" '
              $0 ~ "^## " version " " { found=1 }
              found && $0 ~ "^## " && $0 !~ "^## " version " " { exit }
              found { print }
            ' CHANGELOG.md > /tmp/release-notes.md
            test -s /tmp/release-notes.md
            TITLE=$(head -1 /tmp/release-notes.md | sed -E 's/^## [^ ]+ — //')
            gh release create "$TAG" --target "${{ github.event.workflow_run.head_sha || github.sha }}" --title "$TAG — $TITLE" --notes-file /tmp/release-notes.md --latest
          fi
          gh release upload "$TAG" release-files/* --clobber
