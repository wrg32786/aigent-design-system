name: Build AIgent Desktop release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: true
        default: master
      publish:
        description: Attach installers to the matching GitHub release
        required: true
        type: boolean
        default: true
  push:
    branches:
      - master
    paths:
      - package.json
      - package-lock.json
      - desktop/**
      - electron-builder.yml
      - scripts/prepare-desktop-build.mjs
      - scripts/smoke-packaged-desktop.mjs
      - scripts/verify-desktop-release.mjs
      - .github/workflows/desktop-release.yml

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            command: npm run desktop:dist -- --win nsis --x64 --publish never
          - os: macos-14
            name: macos-arm64
            command: npm run desktop:dist -- --mac dmg zip --arm64 --config.publish.channel=latest-arm64 --publish never
          - os: macos-15-intel
            name: macos-x64
            command: npm run desktop:dist -- --mac dmg zip --x64 --config.publish.channel=latest-x64 --publish never
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:check
      - name: Prepare Apple API key
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - name: Build native installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ -n "$WIN_CSC_LINK" ]; then
              export CSC_LINK="$WIN_CSC_LINK"
              export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
            else
              unset CSC_LINK CSC_KEY_PASSWORD
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          else
            if [ -n "$MAC_CSC_LINK" ]; then
              export CSC_LINK="$MAC_CSC_LINK"
              export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            else
              unset CSC_LINK CSC_KEY_PASSWORD
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          fi
          ${{ matrix.command }}
      - name: Verify packaged application boot
        run: npm run desktop:smoke:packaged
      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          find desktop-dist -maxdepth 1 -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o \
            -name '*.blockmap' -o -name 'latest*.yml' -o -name 'latest*.yaml' \
          \) -exec cp {} release-files/ \;

          if [ "${{ matrix.name }}" = "windows-x64" ]; then
            INSTALLER=$(find desktop-dist -maxdepth 1 -type f -name '*.exe' -print -quit)
            test -n "$INSTALLER"
            cp "$INSTALLER" release-files/AIgent-Desktop-Setup-Windows-x64.exe
          elif [ "${{ matrix.name }}" = "macos-arm64" ]; then
            INSTALLER=$(find desktop-dist -maxdepth 1 -type f -name '*.dmg' -print -quit)
            test -n "$INSTALLER"
            cp "$INSTALLER" release-files/AIgent-Desktop-macOS-Apple-Silicon.dmg
          elif [ "${{ matrix.name }}" = "macos-x64" ]; then
            INSTALLER=$(find desktop-dist -maxdepth 1 -type f -name '*.dmg' -print -quit)
            test -n "$INSTALLER"
            cp "$INSTALLER" release-files/AIgent-Desktop-macOS-Intel.dmg
          fi

          test -n "$(find release-files -maxdepth 1 -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: aigent-desktop-${{ matrix.name }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: aigent-desktop-*
          path: release-files
          merge-multiple: true
      - name: Attach and verify installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v${VERSION}"
          TARGET=$(git rev-parse HEAD)
          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { found=1 }
            found && $0 ~ "^## " && $0 !~ "^## " version " " { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          TITLE=$(head -1 /tmp/release-notes.md | sed -E 's/^## [^ ]+ — //')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$TARGET" --title "$TAG — $TITLE" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$TAG" --target "$TARGET" --title "$TAG — $TITLE" --notes-file /tmp/release-notes.md --latest
          fi
          gh release upload "$TAG" release-files/* --clobber
          node scripts/verify-desktop-release.mjs --tag "$TAG" --download-check

  report:
    needs:
      - build
      - publish
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Publish release status
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TARGET=$(git rev-parse HEAD)
          if [ "$BUILD_RESULT" = "success" ] && { [ "$PUBLISH_RESULT" = "success" ] || [ "$PUBLISH_RESULT" = "skipped" ]; }; then
            STATE=success
          else
            STATE=failure
          fi
          DESCRIPTION="build=${BUILD_RESULT}, publish=${PUBLISH_RESULT}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET}" \
            -f state="$STATE" \
            -f context="desktop-release" \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL"
