name: Publish v0.6.0

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-v0.6.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="6bc610939b1c8595bf695bbdcca9ef824e56f03b"
          if ! git rev-parse -q --verify refs/tags/v0.6.0 >/dev/null; then
            git tag -a v0.6.0 "$TARGET" -m "v0.6.0 — AIgent Studio"
            git push origin v0.6.0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## AIgent Design System v0.6.0

          This release adds **AIgent Studio**, a local interactive website builder that joins the repository's design intelligence, proven starters, live preview, creative-production knowledge, Resolve, Vision, and a locally authenticated coding agent in one operating surface.

          ### Highlights

          - localhost-only Studio UI with brief, live project preview, and agent room
          - desktop, tablet, and mobile preview modes
          - isolated projects created from cinematic page, sales deck, command-center, Three.js, or blank starters
          - authenticated Claude Code and Codex CLI integration; no API key is entered in the browser
          - streamed agent activity, cancellation, and persistent Claude Code project sessions
          - one-click Design Intelligence planning, public-reference forensics, Resolve, and Vision preparation
          - installable `aigent-studio` registry item and specialist operating skill
          - `full-studio` now includes the interactive Studio
          - 16 validated registry systems and 24 validated agent skills
          - path, hidden-file, body-size, JSON, cross-origin, clean-install, desktop, and mobile verification

          ### Run from this repository

          ```bash
          npm install
          npm run studio -- --open
          ```

          ### Install Studio into another project

          ```bash
          pnpm dlx shadcn@latest add wrg32786/aigent-design-system/aigent-studio
          node scripts/studio-server.mjs --open
          ```

          ### Local agent setup

          Authenticate at least one supported CLI:

          ```bash
          npm install -g @anthropic-ai/claude-code
          claude doctor
          ```

          or:

          ```bash
          npm install -g @openai/codex
          codex login
          ```

          Studio edits the actual project files and previews that real project. Static HTML, CSS, and JavaScript are the first-class path in this release; the included starters may use Three.js, Spline, GSAP, video, and the other optional runtimes already supported by the system.

          Release commit: `6bc610939b1c8595bf695bbdcca9ef824e56f03b`
          EOF

          if gh release view v0.6.0 >/dev/null 2>&1; then
            gh release edit v0.6.0 --title "v0.6.0 — AIgent Studio" --notes-file /tmp/release-notes.md --latest
          else
            gh release create v0.6.0 --title "v0.6.0 — AIgent Studio" --notes-file /tmp/release-notes.md --latest --verify-tag
          fi

      - name: Remove merged work branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in \
            docs/fix-readme-hero-headline \
            docs/hero-text-overlay \
            docs/readme-real-proof \
            docs/readme-visual-overhaul \
            docs/replace-readme-images \
            feature/aigent-studio \
            release/v0.6.0
          do
            encoded="${branch//\//%2F}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" || true
          done

      - name: Remove release automation
        run: |
          rm -f .github/workflows/publish-v0.6.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove release automation"
          git push origin HEAD:master
