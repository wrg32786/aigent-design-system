name: Report a bug
about: Report a reproducible problem in a template, pattern, script, registry item, inspiration workflow, or skill
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Registry, CLI, Template, Pattern, Skill, Planner, Inspiration forensics, Reference synthesis, Originality audit, Asset pipeline, Audit, Browser QA, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, item, source kind, browser, viewport, and exact observed behavior. Do not attach private captures or credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, browser, framework, and optional tools such as FFmpeg when relevant.
    validations:
      required: true
