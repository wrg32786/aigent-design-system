</defs><rect width="1600" height="780" fill="url(#bg)"/><rect width="1600" height="780" fill="url(#glow)"/><rect width="1600" height="780" fill="url(#grid)"/><rect x="60" y="48" width="1480" height="680" fill="none" stroke="#65f4df" stroke-opacity=".35"/><line x1="790" y1="48" x2="790" y2="728" stroke="#65f4df" stroke-width="1" opacity="0.45"/><text x="72" y="88" fill="#65f4df" font-family="ui-monospace,monospace" font-size="16" font-weight="700" text-anchor="start" letter-spacing="4">THE AIGENT / DESIGN OPERATING SYSTEM</text><text x="70" y="226" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="900" text-anchor="start">TURN CLAUDE</text><text x="70" y="318" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="900" text-anchor="start">INTO A</text><text x="70" y="410" fill="#65f4df" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="900" text-anchor="start">DESIGN STUDIO.</text><text x="74" y="460" fill="#c3cbc7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">Reference forensics, original synthesis, immersive media,</text><text x="74" y="496" fill="#c3cbc7" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start">ranked repair, and real visual judgment — in one installable system.</text><rect x="74" y="545" width="220" height="38" rx="19" fill="#030807" fill-opacity=".9" stroke="#65f4df"/><text x="184.0" y="570" fill="#65f4df" font-family="ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="middle">15 INSTALLABLE SYSTEMS</text><rect x="310" y="545" width="158" height="38" rx="19" fill="#030807" fill-opacity=".9" stroke="#f07a52"/><text x="389.0" y="570" fill="#f07a52" font-family="ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="middle">23 AGENT SKILLS</text><rect x="484" y="545" width="168" height="38" rx="19" fill="#030807" fill-opacity=".9" stroke="#f5f2ea"/><text x="568.0" y="570" fill="#f5f2ea" font-family="ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="middle">MIT / OPEN SOURCE</text><text x="74" y="704" fill="#f5f2ea" font-family="ui-monospace,monospace" font-size="14" font-weight="500" text-anchor="start" letter-spacing="1">SHAPE  /  INSPIRE  /  SYNTHESIZE  /  PRODUCE  /  BUILD  /  RESOLVE  /  SEE</text><g transform="translate(1065 92) rotate(5 235 145)" filter="url(#shadow)"><rect width="470" height="290" rx="24" fill="#0c0c0b" stroke="#f07a52" stroke-opacity=".6"/><text x="28" y="34" fill="#a9b2ad" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">SLIDE 2 OF 6</text><text x="30" y="105" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="900" text-anchor="start">Turn the</text><text x="30" y="151" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="900" text-anchor="start">scroll into</text><text x="30" y="197" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="900" text-anchor="start">the pitch.</text><circle cx="358" cy="150" r="72" fill="none" stroke="#f07a52" stroke-opacity=".22"/><path d="M295 80L405 220M405 80L295 220" stroke="#f07a52" stroke-opacity=".12"/></g><g transform="translate(1118 288) rotate(4 220 138)" filter="url(#shadow)"><rect width="440" height="276" rx="24" fill="#0a0d0c" stroke="#65f4df" stroke-opacity=".45"/><rect x="0" y="0" width="88" height="276" rx="24" fill="#101513"/><rect x="88" y="0" width="128" height="276" fill="#0b100e"/><text x="238" y="76" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="900" text-anchor="start">Approve</text><text x="238" y="117" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="900" text-anchor="start">homepage</text><text x="238" y="158" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="900" text-anchor="start">proof</text><text x="238" y="199" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="900" text-anchor="start">sequence</text><rect x="350" y="24" width="64" height="30" rx="5" fill="#f07a52"/><text x="382" y="44" fill="#030807" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle">Approve</text></g><g transform="translate(900 190) rotate(-1.5 280 175)" filter="url(#shadow)"><rect width="560" height="350" rx="28" fill="#06112c" stroke="#65f4df" stroke-opacity=".65"/><radialGradient id="orb" cx="50%" cy="45%" r="50%"><stop stop-color="#a5d7ff"/><stop offset=".45" stop-color="#5478d5"/><stop offset="1" stop-color="#1d2b72"/></radialGradient><circle cx="396" cy="190" r="100" fill="url(#orb)"/><ellipse cx="396" cy="190" rx="156" ry="54" fill="none" stroke="#8cb64d" stroke-width="5" transform="rotate(24 396 190)"/><ellipse cx="396" cy="190" rx="156" ry="54" fill="none" stroke="#8cb64d" stroke-width="4" transform="rotate(76 396 190)"/><text x="32" y="38" fill="#65f4df" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">LIVE 3D / PROGRESSIVE ENHANCEMENT</text><text x="34" y="105" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="900" text-anchor="start">Interaction</text><text x="34" y="153" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="900" text-anchor="start">must earn the</text><text x="34" y="201" fill="#f5f2ea" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="900" text-anchor="start">renderer.</text><text x="34" y="240" fill="#c3cbc7" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Live geometry loads only when the device,</text><text x="34" y="260" fill="#c3cbc7" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">motion preference, and connection allow it.</text><rect x="34" y="291" width="112" height="34" rx="6" fill="#6c8cff"/><text x="90" y="313" fill="#07112d" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" text-anchor="middle">Live 3D enabled</text></g><circle cx="60" cy="48" r="5" fill="#65f4df"/><circle cx="1540" cy="48" r="5" fill="#f07a52"/><circle cx="60" cy="728" r="5" fill="#f07a52"/><circle cx="1540" cy="728" r="5" fill="#65f4df"/><rect x="1280" y="86" width="230" height="38" rx="19" fill="#030807" stroke="#f07a52"/><text x="1395" y="111" fill="#f07a52" font-family="ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">REAL REFERENCE SYSTEMS</text></svg>