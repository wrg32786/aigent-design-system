<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">AIgent Design System</title>
  <desc id="desc">A minimal dark typographic hero for the AIgent Design System.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030607"/>
      <stop offset="0.55" stop-color="#071218"/>
      <stop offset="1" stop-color="#030607"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#66f3ed"/>
      <stop offset="1" stop-color="#22b9d5"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="70%">
      <stop stop-color="#55ddeb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#55ddeb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="50%" cy="100%" r="60%">
      <stop stop-color="#38d9e8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38d9e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#65f4df" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#topGlow)"/>
  <rect width="1600" height="800" fill="url(#floorGlow)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <path d="M105 406A695 695 0 0 1 1495 406" fill="none" stroke="#48dbe8" stroke-opacity="0.24"/>
  <path d="M105 406A695 695 0 0 0 1495 406" fill="none" stroke="#48dbe8" stroke-opacity="0.10"/>
  <path d="M80 720H1520" stroke="#65f4df" stroke-opacity="0.15"/>
  <ellipse cx="800" cy="720" rx="420" ry="34" fill="none" stroke="#48dbe8" stroke-opacity="0.25"/>
  <ellipse cx="800" cy="720" rx="280" ry="20" fill="none" stroke="#48dbe8" stroke-opacity="0.22"/>
  <circle cx="800" cy="720" r="5" fill="#67f4ee" filter="url(#softGlow)"/>
  <circle cx="800" cy="108" r="4" fill="#67f4ee" filter="url(#softGlow)"/>
  <path d="M500 108H1100" stroke="#48dbe8" stroke-opacity="0.28"/>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="700" letter-spacing="-7">
    <text x="210" y="360" fill="url(#cyan)" font-size="190">AI</text>
    <text x="405" y="360" fill="#f4f5f3" font-size="190">gent</text>
    <text x="205" y="565" fill="#f4f5f3" font-size="168" textLength="1190" lengthAdjust="spacingAndGlyphs">Design System</text>
  </g>
</svg>
