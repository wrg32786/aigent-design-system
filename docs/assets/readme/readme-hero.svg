<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc"><title id="title">AIgent Design System</title><desc id="desc">Turn Claude into a design studio with inspiration forensics, immersive media, ranked repair, and visual review.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030807"/><stop offset=".58" stop-color="#071411"/><stop offset="1" stop-color="#030807"/></linearGradient>
  <radialGradient id="glow" cx="78%" cy="35%" r="55%"><stop stop-color="#65f4df" stop-opacity=".16"/><stop offset="1" stop-color="#65f4df" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#65f4df" stroke-opacity=".12"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
