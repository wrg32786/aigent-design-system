  <g font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-weight="900" letter-spacing="-2">
    <text x="96" y="132" fill="#f5f2ea" font-size="68">Mechanical pass </text>
    <text x="692" y="132" fill="#f07a52" font-size="68">≠</text>
    <text x="750" y="132" fill="#f5f2ea" font-size="68"> design complete.</text>
  </g>
  <text x="98" y="178" fill="#c3cbc7" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Visual review found a hierarchy issue Resolve missed — and fixed the shared cause.</text>

