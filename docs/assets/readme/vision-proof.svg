<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">AIgent Vision — mechanical pass is not design complete</title>
  <desc id="desc">A polished before, evidence, and after case study showing how structured visual review replaced five competing mobile theme controls with one compact selector.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020706"/>
      <stop offset="0.56" stop-color="#06110f"/>
      <stop offset="1" stop-color="#020706"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#65f4df" stroke-opacity="0.052"/>
    </pattern>
    <filter id="phoneShadow" x="-35%" y="-25%" width="170%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.68"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1672" height="941" fill="url(#ground)"/>
  <rect width="1672" height="941" fill="url(#grid)"/>
  <rect x="62" y="54" width="1548" height="824" fill="none" stroke="#65f4df" stroke-opacity="0.16"/>
