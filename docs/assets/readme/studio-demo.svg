<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AIgent Desktop and Studio in action</title>
<desc id="desc">A ten-second animated walkthrough of setup, the DOM-backed design canvas, responsive inspection, source distillation, Resolve, and Vision.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020706"/><stop offset=".58" stop-color="#071411"/><stop offset="1" stop-color="#020706"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0a1210"/><stop offset="1" stop-color="#060a09"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061713"/><stop offset="1" stop-color="#030807"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".66"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="window"><rect x="70" y="68" width="1460" height="750" rx="34"/></clipPath>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.sans{font-family:Inter,Arial,sans-serif}.muted{fill:#84918c}.line{stroke:#20302b}.cyan{fill:#65f4df}.white{fill:#f5f2ea}.orange{fill:#f07a52}.tiny{font-size:14px;letter-spacing:1.4px}.label{font-size:17px;font-weight:700}.body{font-size:18px}.heading{font-size:34px;font-weight:800}.strong{font-weight:800}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><path d="M0 118H1600M0 786H1600" stroke="#65f4df" stroke-opacity=".07"/>
<g filter="url(#shadow)"><rect x="50" y="48" width="1500" height="790" rx="42" fill="#050908" stroke="#65f4df" stroke-opacity=".26"/></g>
<g clip-path="url(#window)">
  <g id="setup">
    <rect x="70" y="68" width="1460" height="750" fill="url(#screen)"/>
    <rect x="70" y="68" width="430" height="750" fill="#050908"/><path d="M500 68V818" stroke="#62726d" stroke-opacity=".38"/>
    <text x="118" y="116" class="mono cyan tiny strong">DESKTOP INSTALLATION</text>
    <text x="118" y="184" class="sans white" font-size="52" font-weight="900">From download</text><text x="118" y="242" class="sans white" font-size="52" font-weight="900">to live</text><text x="118" y="300" class="sans white" font-size="52" font-weight="900">canvas.</text>
    <text x="118" y="350" class="sans muted body">Configure the workspace, connect</text><text x="118" y="378" class="sans muted body">a coding agent, then launch Studio.</text>
    <g transform="translate(118 438)"><rect width="326" height="74" rx="12" fill="#0b201b" stroke="#65f4df" stroke-opacity=".55"/><text x="22" y="31" class="mono cyan tiny">01</text><text x="68" y="31" class="sans white label">Workspace</text><text x="68" y="54" class="sans muted" font-size="15">Choose where projects live</text></g>
    <g transform="translate(118 532)"><text x="22" y="31" class="mono muted tiny">02</text><text x="68" y="31" class="sans muted label">System check</text><text x="68" y="54" class="sans muted" font-size="15">Verify required tools</text></g>
    <g transform="translate(118 626)"><text x="22" y="31" class="mono muted tiny">03</text><text x="68" y="31" class="sans muted label">Design agent</text><text x="68" y="54" class="sans muted" font-size="15">Claude Code or Codex</text></g>
    <text x="566" y="116" class="mono cyan tiny strong">01 / WORKSPACE</text>
    <text x="566" y="198" class="sans white" font-size="58" font-weight="900">Choose where</text><text x="566" y="260" class="sans white" font-size="58" font-weight="900">your sites live.</text>
    <text x="566" y="320" class="sans muted body">Projects stay outside the application, so updates never remove work.</text>
    <g transform="translate(566 378)"><rect width="850" height="130" rx="18" fill="#0b1714" stroke="#2d413b"/><text x="28" y="42" class="mono muted tiny">CURRENT WORKSPACE</text><text x="28" y="82" class="sans white" font-size="22" font-weight="700">~/Documents/AIgent Studio Projects</text><rect x="650" y="36" width="166" height="58" rx="10" fill="#111a18" stroke="#53645f"/><text x="733" y="72" class="sans white label" text-anchor="middle">Choose folder</text></g>
    <g transform="translate(566 538)"><rect width="260" height="136" rx="16" fill="#08110f" stroke="#22332e"/><text x="24" y="36" class="mono cyan tiny">01</text><text x="24" y="78" class="sans white label">Project-safe</text><text x="24" y="106" class="sans muted" font-size="15">App and workspace stay separate.</text></g>
    <g transform="translate(850 538)"><rect width="260" height="136" rx="16" fill="#08110f" stroke="#22332e"/><text x="24" y="36" class="mono cyan tiny">02</text><text x="24" y="78" class="sans white label">Portable</text><text x="24" y="106" class="sans muted" font-size="15">Open the real source anywhere.</text></g>
    <g transform="translate(1134 538)"><rect width="282" height="136" rx="16" fill="#08110f" stroke="#22332e"/><text x="24" y="36" class="mono cyan tiny">03</text><text x="24" y="78" class="sans white label">Local-first</text><text x="24" y="106" class="sans muted" font-size="15">Studio stays on localhost.</text></g>
    <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;.24;.31;.96;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <g id="studio" opacity="0">
    <rect x="70" y="68" width="1460" height="750" fill="#050807"/>
    <rect x="70" y="68" width="1460" height="62" fill="#0a0f0e"/><path d="M70 130H1530" class="line"/>
    <text x="98" y="106" class="sans white" font-size="25" font-weight="900">AIgent</text><text x="186" y="106" class="sans muted" font-size="19">Studio</text><rect x="244" y="87" width="38" height="24" rx="12" fill="#10342c"/><text x="263" y="104" class="mono cyan" font-size="12" text-anchor="middle">1.0</text>
    <rect x="326" y="82" width="240" height="36" rx="8" fill="#111715" stroke="#2b3935"/><text x="344" y="106" class="sans white" font-size="15">Cinematic product page</text>
    <g transform="translate(650 83)"><rect width="86" height="34" rx="17" fill="#111715"/><text x="43" y="22" class="sans muted" font-size="14" text-anchor="middle">Preview</text><rect x="90" width="78" height="34" rx="17" fill="#12382f" stroke="#65f4df"/><text x="129" y="22" class="sans cyan" font-size="14" font-weight="700" text-anchor="middle">Design</text><rect x="172" width="88" height="34" rx="17" fill="#111715"/><text x="216" y="22" class="sans muted" font-size="14" text-anchor="middle">Comment</text></g>
    <circle cx="1456" cy="99" r="6" fill="#65f4df"/><text x="1471" y="104" class="sans muted" font-size="14">Ready</text>
    <rect x="70" y="130" width="300" height="688" fill="url(#panel)"/><path d="M370 130V818" class="line"/>
    <g transform="translate(88 148)"><text x="0" y="20" class="mono cyan tiny">DOM-BACKED CANVAS</text><text x="0" y="62" class="sans white heading">Real layers.</text><rect y="86" width="260" height="42" rx="8" fill="#0d1513" stroke="#263630"/><text x="16" y="112" class="sans muted" font-size="14">Filter layers</text></g>
    <g transform="translate(90 300)" class="sans"><text x="0" y="0" class="muted" font-size="15">▾  Page</text><text x="24" y="42" class="muted" font-size="15">▾  Main</text><rect x="38" y="58" width="226" height="44" rx="8" fill="#0d2a23" stroke="#65f4df"/><text x="54" y="86" class="white" font-size="15" font-weight="700">H1  Hero heading</text><text x="54" y="132" class="muted" font-size="15">P  Lead copy</text><text x="54" y="176" class="muted" font-size="15">DIV  Actions</text><text x="24" y="226" class="muted" font-size="15">▸  Proof</text><text x="24" y="270" class="muted" font-size="15">▸  Product stage</text></g>
    <rect x="370" y="130" width="820" height="688" fill="#070b0a"/><rect x="394" y="154" width="772" height="52" rx="10" fill="#0b1110"/><text x="418" y="177" class="mono cyan tiny">LIVE PRODUCTION CODE</text><text x="418" y="196" class="sans white" font-size="15" font-weight="700">Cinematic product page</text><g transform="translate(850 163)"><rect width="84" height="34" rx="17" fill="#153a31"/><text x="42" y="22" class="sans cyan" font-size="14" text-anchor="middle">Desktop</text><text x="116" y="22" class="sans muted" font-size="14">Tablet</text><text x="184" y="22" class="sans muted" font-size="14">Mobile</text></g>
    <g transform="translate(418 226)"><rect width="724" height="520" rx="16" fill="#020607" stroke="#293b35"/><rect width="724" height="34" rx="16" fill="#0c1211"/><circle cx="18" cy="17" r="5" fill="#f07a52"/><circle cx="36" cy="17" r="5" fill="#c8d468"/><circle cx="54" cy="17" r="5" fill="#65f4df"/><text x="362" y="22" class="mono muted" font-size="12" text-anchor="middle">localhost / preview</text><rect x="0" y="34" width="724" height="486" fill="url(#screen)"/><text x="48" y="100" class="mono cyan tiny">EXPERIENCE SURFACE</text><text x="48" y="182" class="sans white" font-size="56" font-weight="900">A cinematic page</text><text x="48" y="242" class="sans white" font-size="56" font-weight="900">needs a <tspan fill="#f07a52">point of view.</tspan></text><text x="48" y="300" class="sans muted" font-size="18">Real media. Real hierarchy. Real responsive behavior.</text><rect x="48" y="350" width="184" height="52" rx="8" fill="#f07a52"/><text x="140" y="383" fill="#07100e" class="sans label" text-anchor="middle">Use the system</text><circle cx="575" cy="275" r="92" fill="#153f62"/><ellipse cx="575" cy="275" rx="145" ry="46" fill="none" stroke="#b9d951" stroke-width="4" transform="rotate(24 575 275)"/><ellipse cx="575" cy="275" rx="145" ry="46" fill="none" stroke="#b9d951" stroke-width="3" transform="rotate(78 575 275)"/></g>
    <rect x="1190" y="130" width="340" height="688" fill="url(#panel)"/><path d="M1190 130V818" class="line"/><g transform="translate(1214 150)"><text x="0" y="18" class="mono cyan tiny">SELECTED ELEMENT</text><text x="0" y="54" class="sans white" font-size="24" font-weight="800">Hero heading</text><text x="0" y="78" class="mono muted" font-size="13">index.html · h1.hero-title</text><path d="M0 100H292" class="line"/><text x="0" y="138" class="sans white label">Typography</text><text x="0" y="176" class="sans muted" font-size="14">Font size</text><rect x="0" y="190" width="136" height="46" rx="8" fill="#0b1512" stroke="#31443e"/><text x="68" y="220" class="mono orange" font-size="18" text-anchor="middle">91.92px</text><text x="154" y="220" class="cyan" font-size="24">→</text><rect x="184" y="190" width="108" height="46" rx="8" fill="#0b1512" stroke="#65f4df"/><text x="238" y="220" class="mono cyan" font-size="18" text-anchor="middle">72px</text><text x="0" y="278" class="sans white label">Breakpoint</text><rect x="0" y="294" width="292" height="44" rx="8" fill="#0b1512" stroke="#31443e"/><text x="18" y="322" class="sans white" font-size="15">Mobile</text><text x="270" y="322" class="muted" font-size="18">⌄</text><path d="M0 366H292" class="line"/><text x="0" y="404" class="sans white label">Canvas journal</text><text x="0" y="434" class="sans muted" font-size="14">1 responsive operation</text><rect x="0" y="460" width="292" height="50" rx="9" fill="#12382f" stroke="#65f4df"/><text x="146" y="492" class="sans cyan label" text-anchor="middle">Distill into source</text><rect x="0" y="526" width="138" height="44" rx="8" fill="#0b1512" stroke="#31443e"/><text x="69" y="554" class="sans white" font-size="14" text-anchor="middle">Resolve</text><rect x="154" y="526" width="138" height="44" rx="8" fill="#0b1512" stroke="#31443e"/><text x="223" y="554" class="sans white" font-size="14" text-anchor="middle">Vision</text></g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.27;.34;.96;1" dur="10s" repeatCount="indefinite"/>
  </g>
</g>
<g opacity="0" filter="url(#glow)"><path d="M0 0V42l11-10 11 22 11-6-11-21 15-1z" fill="#fff" stroke="#020706" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="730 450;730 450;610 374;1275 354;1340 636;1340 636" keyTimes="0;.34;.48;.64;.82;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.32;.38;.92;.96;1" dur="10s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="462" y="371" width="575" height="136" rx="8" fill="none" stroke="#65f4df" stroke-width="5"/><rect x="462" y="340" width="196" height="31" rx="5" fill="#65f4df"/><text x="477" y="363" class="mono" fill="#03110e" font-size="16" font-weight="800">H1 · REAL DOM NODE</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.43;.50;.63;.70;1" dur="10s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="1212" y="322" width="298" height="270" rx="14" fill="none" stroke="#65f4df" stroke-width="4"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.61;.67;.80;.86;1" dur="10s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="390" y="724" width="820" height="68" rx="34" fill="#03110e" stroke="#65f4df"/><text x="800" y="767" class="mono white" font-size="18" font-weight="700" text-anchor="middle">CANVAS JOURNAL → AGENT DISTILLATION → RESOLVE → VISION</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.80;.86;.96;1" dur="10s" repeatCount="indefinite"/></g>
<text x="70" y="872" class="sans white" font-size="28" font-weight="800">AIgent Desktop → real DOM Canvas → agent → verified source</text><text x="1530" y="870" class="mono cyan" font-size="16" text-anchor="end">10 SECOND LOOP</text>
