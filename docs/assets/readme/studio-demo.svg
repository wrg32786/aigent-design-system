<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">AIgent Studio real UI walkthrough</title>
<desc id="desc">An animated walkthrough using the real AIgent Studio interface: select a DOM layer, inspect the rendered heading, edit responsive typography, then distill and verify the source.</desc>
<defs>
  <linearGradient id="caption" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#020806" stop-opacity=".97"/><stop offset="1" stop-color="#07110e" stop-opacity=".93"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="screen"><rect width="1200" height="675" rx="20"/></clipPath>
  <style>.sans{font-family:Inter,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.white{fill:#f5f2ea}.cyan{fill:#65f4df}.muted{fill:#a3aea8}.strong{font-weight:800}</style>
</defs>
<g clip-path="url(#screen)">
  <rect width="1200" height="675" fill="#020706"/>
  <image x="0" y="-79" width="1200" height="833" preserveAspectRatio="none" href="data:image/jpeg;base64,">
    <animate attributeName="y" values="-79;-79;-158;-158;-79" keyTimes="0;.48;.58;.84;1" dur="10s" repeatCount="indefinite"/>
  </image>
  <rect width="1200" height="675" fill="none" stroke="#65f4df" stroke-opacity=".32" stroke-width="2"/>

  <g opacity="0">
    <rect x="12" y="194" width="214" height="31" rx="6" fill="none" stroke="#65f4df" stroke-width="3"/>
    <rect x="12" y="164" width="195" height="30" rx="5" fill="#65f4df"/>
    <text x="24" y="185" class="mono strong" fill="#03110e" font-size="14">1 · SELECT REAL LAYER</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.24;.32;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <g opacity="0">
    <rect x="275" y="273" width="533" height="137" rx="4" fill="none" stroke="#65f4df" stroke-width="4"/>
    <rect x="275" y="242" width="205" height="31" rx="5" fill="#65f4df"/>
    <text x="287" y="264" class="mono strong" fill="#03110e" font-size="14">2 · REAL DOM HEADING</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.22;.30;.48;.55;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <g opacity="0">
    <rect x="1048" y="596" width="141" height="49" rx="7" fill="none" stroke="#65f4df" stroke-width="4"/>
    <rect x="949" y="557" width="240" height="31" rx="5" fill="#65f4df"/>
    <text x="961" y="579" class="mono strong" fill="#03110e" font-size="14">3 · RESPONSIVE PROPERTY</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.54;.62;.81;.87;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <g opacity="0" filter="url(#glow)">
    <path d="M0 0V34l9-8 10 19 9-5-10-18 13-1z" fill="#f5f2ea" stroke="#020706" stroke-width="2"/>
    <animateMotion dur="10s" repeatCount="indefinite" path="M150 210 C260 230 350 330 520 340 S940 280 1110 620" keyTimes="0;.25;.55;1" keyPoints="0;.28;.68;1" calcMode="spline" keySplines=".2 0 .2 1;.2 0 .2 1;.2 0 .2 1"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;.06;.82;.92;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <g opacity="0">
    <rect x="42" y="544" width="1116" height="92" rx="17" fill="url(#caption)" stroke="#65f4df" stroke-opacity=".6"/>
    <text x="66" y="572" class="mono cyan strong" font-size="14">CANVAS JOURNAL → AGENT DISTILLATION → RESOLVE → VISION</text>
    <text x="66" y="610" class="sans white strong" font-size="25">Edit the rendered site. Preserve intent. Ship verified source.</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.80;.86;.96;1" dur="10s" repeatCount="indefinite"/>
  </g>
</g>
</svg>
