<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050608"/><stop offset="1" stop-color="#171c22"/></linearGradient></defs><rect width="1200" height="800" fill="url(#g)"/><text x="70" y="100" font-family="Arial" font-size="20" fill="#8f9aa6">STRONG CINEMATIC — one world, one motion thesis</text><rect x="70" y="150" width="1060" height="460" rx="18" fill="#10151a" stroke="#3d4853"/><circle cx="820" cy="380" r="165" fill="#29333d"/><circle cx="820" cy="380" r="95" fill="#55616d"/><path d="M160 520 C360 360 540 430 705 320" fill="none" stroke="#d8b56b" stroke-width="8"/><text x="115" y="265" font-family="Arial" font-size="64" font-weight="700" fill="#f3f0e8">ONE MEDIA</text><text x="115" y="330" font-family="Arial" font-size="64" font-weight="700" fill="#f3f0e8">SYSTEM</text><text x="115" y="390" font-family="Arial" font-size="24" fill="#aab4bd">Text, camera, and transition logic belong to the same authored world.</text><text x="70" y="675" font-family="Arial" font-size="22" fill="#d8b56b">Motion thesis: one meaningful continuity idea, not reveal effects on every section.</text><text x="70" y="735" font-family="Arial" font-size="18" fill="#7f8a94">LEARN: coherence and focal motion. DO NOT COPY: scene, object, palette, or exact path.</text></svg>