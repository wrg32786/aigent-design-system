<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f3f0e8"/><rect x="70" y="70" width="1060" height="660" fill="none" stroke="#222" stroke-width="2"/><text x="90" y="125" font-family="Arial" font-size="20" fill="#444">STRONG EDITORIAL — learn hierarchy, not styling</text><text x="90" y="290" font-family="Arial" font-weight="700" font-size="112" fill="#111">ONE IDEA</text><text x="90" y="390" font-family="Arial" font-weight="700" font-size="112" fill="#111">LEADS.</text><line x1="90" y1="455" x2="720" y2="455" stroke="#111" stroke-width="3"/><text x="90" y="510" font-family="Arial" font-size="28" fill="#333">Proof and context stay visibly subordinate.</text><text x="90" y="555" font-family="Arial" font-size="28" fill="#333">Negative space is part of the structure.</text><rect x="815" y="215" width="260" height="330" fill="#222"/><circle cx="945" cy="380" r="66" fill="#f3f0e8"/><text x="815" y="595" font-family="Arial" font-size="19" fill="#444">Dominant artifact / media</text><text x="90" y="690" font-family="Arial" font-size="18" fill="#666">DO NOT COPY: exact geometry, palette, type, content. LEARN: degree of hierarchy and asymmetry.</text></svg>