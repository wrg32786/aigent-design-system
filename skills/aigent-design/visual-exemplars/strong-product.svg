<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0d1117"/><text x="70" y="100" font-family="Arial" font-size="20" fill="#8aa0b5">STRONG PRODUCT — evidence leads</text><text x="70" y="220" font-family="Arial" font-size="72" font-weight="700" fill="#f7f9fb">Show the product.</text><text x="70" y="275" font-family="Arial" font-size="26" fill="#9ba9b6">Copy explains what the evidence already begins to prove.</text><rect x="70" y="345" width="750" height="340" rx="10" fill="#151c24" stroke="#60758a"/><rect x="100" y="380" width="160" height="270" fill="#202b36"/><rect x="290" y="385" width="490" height="55" fill="#233142"/><rect x="290" y="470" width="310" height="145" fill="#1b2734"/><rect x="625" y="470" width="155" height="145" fill="#26394b"/><text x="850" y="390" font-family="Arial" font-size="19" fill="#6fd5c8">PRIMARY PROOF</text><text x="850" y="435" font-family="Arial" font-size="28" fill="#f7f9fb">Real interface</text><text x="850" y="477" font-family="Arial" font-size="28" fill="#f7f9fb">or artifact</text><text x="850" y="540" font-family="Arial" font-size="20" fill="#9ba9b6">Controls, copy, badges and secondary proof do not compete with the product.</text><text x="70" y="750" font-family="Arial" font-size="18" fill="#6f8193">LEARN: product evidence hierarchy. DO NOT COPY: exact UI, palette, geometry, or content.</text></svg>