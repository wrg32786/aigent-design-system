<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080716"/><stop offset="1" stop-color="#121a2d"/></linearGradient><linearGradient id="text" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="1200" height="800" fill="url(#bg)"/><circle cx="980" cy="130" r="240" fill="#5b21b6" opacity=".24"/><circle cx="160" cy="690" r="260" fill="#0ea5e9" opacity=".18"/><text x="70" y="100" font-family="Arial" font-size="20" fill="#a5b4c8">WEAK DEFAULT — polished but unspecific AI SaaS</text><text x="70" y="270" font-family="Arial" font-size="92" font-weight="700" fill="url(#text)">Build the future</text><text x="70" y="335" font-family="Arial" font-size="28" fill="#b7c4d6">Generic gradient headline + glow + floating orb + equal feature cards.</text><g fill="#161f33" stroke="#44516b"><rect x="70" y="430" width="310" height="180" rx="24"/><rect x="445" y="430" width="310" height="180" rx="24"/><rect x="820" y="430" width="310" height="180" rx="24"/></g><text x="70" y="700" font-family="Arial" font-size="22" fill="#f29a9a">Problem: visual polish does not communicate what this product uniquely is.</text><text x="70" y="745" font-family="Arial" font-size="18" fill="#8fa0b8">Use product-specific proof, material, hierarchy, and interaction instead of category costume.</text></svg>