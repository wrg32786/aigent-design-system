<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f5f7fa"/><text x="70" y="100" font-family="Arial" font-size="20" fill="#555">WEAK DEFAULT — equal cards flatten the page</text><text x="70" y="185" font-family="Arial" font-size="58" font-weight="700" fill="#111">Everything has the same weight.</text><g fill="#fff" stroke="#cfd6df"><rect x="70" y="245" width="320" height="180" rx="20"/><rect x="440" y="245" width="320" height="180" rx="20"/><rect x="810" y="245" width="320" height="180" rx="20"/><rect x="70" y="465" width="320" height="180" rx="20"/><rect x="440" y="465" width="320" height="180" rx="20"/><rect x="810" y="465" width="320" height="180" rx="20"/></g><g font-family="Arial" font-size="24" fill="#333"><text x="100" y="305">Feature</text><text x="470" y="305">Feature</text><text x="840" y="305">Feature</text><text x="100" y="525">Feature</text><text x="470" y="525">Feature</text><text x="840" y="525">Feature</text></g><text x="70" y="720" font-family="Arial" font-size="22" fill="#8b2f2f">Problem: repetition becomes the composition. Use proximity and hierarchy before adding containers.</text></svg>