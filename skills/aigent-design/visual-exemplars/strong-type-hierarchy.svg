<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#faf9f6"/><text x="70" y="100" font-family="Arial" font-size="20" fill="#555">STRONG TYPE HIERARCHY — roles before decoration</text><text x="70" y="255" font-family="Arial" font-size="110" font-weight="700" fill="#111">Primary idea</text><text x="74" y="325" font-family="Arial" font-size="34" font-weight="700" fill="#222">A clear secondary heading</text><text x="74" y="390" font-family="Arial" font-size="27" fill="#444">Readable body copy carries the explanation without competing with the headline.</text><text x="74" y="435" font-family="Arial" font-size="27" fill="#444">Spacing reinforces role changes instead of another box.</text><text x="74" y="540" font-family="monospace" font-size="18" fill="#666">LABEL / METADATA / STATUS</text><line x1="74" y1="570" x2="1050" y2="570" stroke="#bbb"/><text x="74" y="650" font-family="Arial" font-size="22" fill="#333">Strong contrast in size, weight, measure, and spacing creates the hierarchy.</text><text x="74" y="730" font-family="Arial" font-size="18" fill="#777">LEARN: role contrast. DO NOT COPY: fonts, sizes, wording, or exact spacing.</text></svg>